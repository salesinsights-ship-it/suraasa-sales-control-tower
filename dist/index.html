<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suraasa Sales Control Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4f8;
  --bg2: #e8edf5;
  --card: #ffffff;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-2: #334155;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --navy: #0c1528;
  --navy-2: #152040;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --accent-soft: #eff6ff;
  --accent-text: #1d4ed8;
  --green: #16a34a;
  --green-bg: #f0fdf4;
  --amber: #d97706;
  --amber-bg: #fffbeb;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --grey: #6b7280;
  --grey-bg: #f9fafb;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
  --shadow: 0 4px 6px -1px rgba(15,23,42,.08), 0 2px 4px -2px rgba(15,23,42,.04);
  --shadow-lg: 0 10px 15px -3px rgba(15,23,42,.1), 0 4px 6px -4px rgba(15,23,42,.05);
  --sidebar: 248px;
  font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
}

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { color: var(--accent-text); text-decoration: none; transition: color .15s ease; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; transition: all .15s ease; }
input, select, textarea { font: inherit; color: var(--text); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.02em; }
h1 { font-size: 21px; font-weight: 700; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }

/* ── App Shell ── */
.app { display: flex; min-height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar);
  background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
  color: #cbd5e1;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; bottom: 0; left: 0;
  z-index: 20;
  box-shadow: 4px 0 24px rgba(0,0,0,.18);
}
.brand {
  padding: 20px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,.07);
  background: rgba(0,0,0,.15);
}
.brand .t {
  color: #fff;
  font-weight: 700;
  font-size: 14.5px;
  letter-spacing: -.025em;
  line-height: 1.3;
}
.brand .s {
  font-size: 10.5px;
  color: #64748b;
  margin-top: 3px;
  letter-spacing: .01em;
}
.nav { padding: 10px 8px; flex: 1; overflow: auto; }
.nav::-webkit-scrollbar { width: 4px; }
.nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }
.nav .grp {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: #475569;
  padding: 14px 10px 5px;
  font-weight: 600;
}
.nav button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  color: #94a3b8;
  padding: 7px 10px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 1px;
  letter-spacing: -.01em;
}
.nav .nl { display: flex; align-items: center; gap: 9px; }
.nav .nl svg { opacity: .6; flex-shrink: 0; }
.nav button.active .nl svg { opacity: 1; }
.nav button:hover {
  background: rgba(255,255,255,.07);
  color: #e2e8f0;
}
.nav button.active {
  background: linear-gradient(135deg, rgba(59,130,246,.35) 0%, rgba(59,130,246,.2) 100%);
  color: #fff;
  box-shadow: inset 0 0 0 1px rgba(59,130,246,.3);
}
.nav button.active .nl svg { opacity: 1; }
.nav .cnt {
  font-size: 10.5px;
  background: rgba(255,255,255,.1);
  padding: 1px 7px;
  border-radius: 999px;
  color: #cbd5e1;
  font-weight: 600;
  letter-spacing: 0;
}
.nav .cnt.red { background: var(--red); color: #fff; }
.nav .cnt.amber { background: #d97706; color: #fff; }
.side-foot {
  padding: 14px 16px;
  font-size: 10.5px;
  color: #475569;
  border-top: 1px solid rgba(255,255,255,.06);
  line-height: 1.5;
}

/* ── Main Area ── */
.main { margin-left: var(--sidebar); flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ── Topbar (Glassmorphism) ── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 15;
  background: rgba(240,244,248,.85);
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  border-bottom: 1px solid rgba(226,232,240,.8);
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 1px 0 rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.04);
}
.topbar .title {
  font-weight: 700;
  font-size: 15px;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -.02em;
  color: var(--text);
}
.topbar input.search {
  width: 280px;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  font-size: 13px;
  box-shadow: var(--shadow-sm);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.topbar input.search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,.12);
}
.topbar .date {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  font-weight: 500;
}

/* ── Content Area ── */
.content { padding: 24px 28px 64px; max-width: 1560px; width: 100%; }

/* ── Buttons ── */
.btn {
  border: 1px solid var(--border-strong);
  background: var(--card);
  color: var(--text-2);
  padding: 6px 13px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.25;
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
  letter-spacing: -.01em;
}
.btn:hover {
  background: var(--bg2);
  border-color: var(--border-strong);
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(0); box-shadow: var(--shadow-sm); }
.btn.primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
  border-color: var(--accent-hover);
  color: #fff;
  box-shadow: 0 2px 8px rgba(59,130,246,.35), var(--shadow-sm);
}
.btn.primary:hover {
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  box-shadow: 0 4px 14px rgba(59,130,246,.45), var(--shadow);
  transform: translateY(-1px);
}
.btn.danger { color: var(--red); border-color: #fca5a5; background: var(--card); }
.btn.danger:hover { background: var(--red-bg); border-color: var(--red); box-shadow: var(--shadow); }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-text); box-shadow: none; }
.btn.ghost:hover { background: var(--accent-soft); box-shadow: none; transform: none; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ── Cards ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  transition: box-shadow .2s ease, transform .2s ease;
}
.card:hover { box-shadow: var(--shadow-lg); }
.card .hd {
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: linear-gradient(to bottom, rgba(248,250,252,1) 0%, rgba(255,255,255,0) 100%);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.card .bd { padding: 16px 18px; }

/* ── Grid ── */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }

/* ── KPI Cards ── */
.kpis {
  display: grid;
  grid-template-columns: repeat(9, minmax(0,1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.kpi {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 14px 12px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all .2s ease;
  position: relative;
  overflow: hidden;
}
.kpi::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--muted-2);
  border-radius: var(--radius-lg) 0 0 var(--radius-lg);
}
.kpi:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}
.kpi .v {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -.04em;
  line-height: 1.05;
  color: var(--text);
}
.kpi .l {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
  font-weight: 500;
  letter-spacing: .01em;
  line-height: 1.3;
}
.kpi.red::before { background: var(--red); }
.kpi.red .v { color: var(--red); }
.kpi.amber::before { background: var(--amber); }
.kpi.amber .v { color: var(--amber); }
.kpi.green::before { background: var(--green); }
.kpi.green .v { color: var(--green); }
.kpi.grey::before { background: var(--grey); }
.kpi.grey .v { color: var(--grey); }

/* ── Sections ── */
.section { margin-bottom: 20px; }
.sec-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.sec-title h2 { font-size: 15px; letter-spacing: -.02em; }
.sub { font-size: 12px; color: var(--muted); font-weight: 400; }
.note {
  font-size: 13px;
  color: var(--text-2);
  background: #f8fafc;
  border: 1px dashed var(--border-strong);
  padding: 11px 14px;
  border-radius: var(--radius);
  line-height: 1.5;
}
.note.warn {
  background: var(--amber-bg);
  border-color: #fcd34d;
  color: #78350f;
}
.note.info {
  background: var(--accent-soft);
  border-color: #bfdbfe;
  color: #1e3a8a;
}

/* ── Tables ── */
table.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.tbl th {
  text-align: left;
  font-weight: 600;
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 10px 13px;
  border-bottom: 1px solid var(--border);
  background: #f8fafc;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  position: sticky;
  top: 0;
  z-index: 1;
}
table.tbl th:first-child { border-radius: var(--radius) 0 0 0; }
table.tbl th:last-child { border-radius: 0 var(--radius) 0 0; }
table.tbl th.nosort { cursor: default; }
table.tbl th:hover:not(.nosort) { color: var(--text); background: #f1f5f9; }
table.tbl td {
  padding: 10px 13px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  transition: background .1s;
}
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl tr:nth-child(even) td { background: rgba(248,250,252,.6); }
table.tbl tr.row:hover td {
  background: var(--accent-soft) !important;
}
table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .link { color: var(--accent-text); cursor: pointer; font-weight: 500; transition: color .15s; }
.tbl .link:hover { color: var(--accent-hover); text-decoration: underline; }
.tbl-wrap { overflow: auto; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.empty {
  padding: 32px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  font-style: italic;
}

/* ── Pills / Badges ── */
.pill {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  border: 1px solid transparent;
  letter-spacing: .01em;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}
.pill.green { background: var(--green-bg); color: var(--green); border-color: #bbf7d0; }
.pill.amber { background: var(--amber-bg); color: #92400e; border-color: #fde68a; }
.pill.red { background: var(--red-bg); color: var(--red); border-color: #fecaca; }
.pill.grey { background: var(--grey-bg); color: var(--grey); border-color: #e5e7eb; }
.pill.blue { background: var(--accent-soft); color: var(--accent-text); border-color: #bfdbfe; }
.pill.outline { background: var(--card); border-color: var(--border-strong); color: var(--text-2); }
.pill.p0 { background: #0c1528; color: #f8fafc; border-color: #1e293b; }
.pill.p1 { background: var(--red-bg); color: var(--red); border-color: #fecaca; }
.pill.p2 { background: var(--amber-bg); color: #92400e; border-color: #fde68a; }
.pill.p3 { background: var(--grey-bg); color: var(--grey); border-color: #e5e7eb; }

.tbd { color: var(--amber); font-weight: 600; }
.dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
  flex-shrink: 0;
}
.dot.green { background: #22c55e; box-shadow: 0 0 0 2px #dcfce7; }
.dot.amber { background: #f59e0b; box-shadow: 0 0 0 2px #fef9c3; }
.dot.red { background: #ef4444; box-shadow: 0 0 0 2px #fee2e2; }
.dot.grey { background: #9ca3af; box-shadow: 0 0 0 2px #f3f4f6; }

/* ── Progress Bars ── */
.prog {
  height: 8px;
  background: var(--bg2);
  border-radius: 999px;
  overflow: hidden;
  min-width: 70px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.06);
}
.prog i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--accent) 0%, #60a5fa 100%);
  border-radius: 999px;
  transition: width .3s ease;
}
.progwrap {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}

/* ── Filters ── */
.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 14px;
}
.filters select, .filters input {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--card);
  font-size: 13px;
  box-shadow: var(--shadow-sm);
  outline: none;
  transition: border-color .15s;
}
.filters select:focus, .filters input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,.1);
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.tabs button {
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 9px 14px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  margin-bottom: -1px;
  letter-spacing: -.01em;
  border-radius: var(--radius) var(--radius) 0 0;
  transition: color .15s, background .15s;
}
.tabs button:hover { color: var(--text-2); background: var(--bg2); }
.tabs button.active {
  color: var(--text);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.tabs button .cnt {
  margin-left: 6px;
  font-size: 10.5px;
  background: var(--bg2);
  padding: 1px 7px;
  border-radius: 999px;
  color: var(--text-2);
  font-weight: 600;
}
.tabs button.active .cnt {
  background: var(--accent-soft);
  color: var(--accent-text);
}

/* ── Detail / Definition Lists ── */
.dl {
  display: grid;
  grid-template-columns: 175px 1fr;
  gap: 7px 16px;
  font-size: 13px;
}
.dl dt { color: var(--muted); font-weight: 500; padding-top: 1px; }
.dl dd { margin: 0; color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.list { margin: 0; padding-left: 18px; }
.list li { margin: 4px 0; line-height: 1.5; }
.back {
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  margin-bottom: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 500;
  transition: color .15s;
}
.back:hover { color: var(--text); }

/* ── Workstream Blocks ── */
.ws-block {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.ws-block .ws-hd {
  background: linear-gradient(to bottom, #f8fafc, #f1f5f9);
  padding: 10px 14px;
  font-weight: 600;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.ms-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  transition: background .12s;
}
.ms-row:hover { background: #f8fafc; }
.ms-row .n { flex: 1; }
.task-sub { padding-left: 28px; color: var(--text-2); }
.comment {
  border-top: 1px solid var(--border);
  padding: 10px 0;
  font-size: 13px;
  line-height: 1.5;
}
.comment .m { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 500; }
.inline-sel {
  padding: 3px 7px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  font-size: 12px;
  outline: none;
  transition: border-color .15s;
  box-shadow: var(--shadow-sm);
}
.inline-sel:focus { border-color: var(--accent); }
.inline-inp {
  padding: 3px 7px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  font-size: 12px;
  width: 58px;
  outline: none;
  transition: border-color .15s;
  box-shadow: var(--shadow-sm);
}
.inline-inp:focus { border-color: var(--accent); }

/* ── Modal ── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.55);
  z-index: 50;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 48px 16px;
  overflow: auto;
  backdrop-filter: blur(4px);
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--card);
  border-radius: var(--radius-lg);
  width: 740px;
  max-width: 100%;
  box-shadow: 0 24px 64px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.12);
  border: 1px solid var(--border);
  animation: slideUp .18s ease;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.modal .mh {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(to bottom, #f8fafc, #fff);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.modal .mb {
  padding: 18px 20px;
  max-height: 72vh;
  overflow: auto;
}
.modal .mf {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: #f8fafc;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}

/* ── Form ── */
.form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 14px;
}
.form .f { display: flex; flex-direction: column; gap: 5px; }
.form .f.full { grid-column: 1 / -1; }
.form label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .01em; }
.form input, .form select, .form textarea {
  padding: 8px 10px;

      + '<div class="brief-card"><div class="brief-h"><span>Due in the next 7 days</span><b>' + due7.length + '</b></div>' + li(due7, a => '<li><span class="link" data-act="go" data-go=\'' + JSON.stringify(a.go) + '\'>' + esc(a.text) + '</span><span class="when">' + fmt(a.due) + '</span></li>', 'Nothing due this week.') + '</div>'
      + '<div class="brief-card"><div class="brief-h"><span>Unassigned</span><b>' + noOwner + '</b></div><div class="mini">' + (noOwner ? noOwner + ' of ' + st.total + ' projects still have a placeholder owner. Assign them from each project\'s charter.' : 'Every project has an owner.') + '</div><div style="margin-top:8px"><span class="link" data-act="go-portfolio">Open portfolio</span></div></div></div>';
    return `
    <div class="kpis">
      ${kpi('', st.total, 'Total projects', 'go-portfolio')}${kpi('green', st.active, 'Active (In Progress)', 'go-portfolio')}${kpi('grey', st.notStarted, 'Not started', 'go-portfolio')}
      ${kpi('amber', st.atRisk, 'At risk (Amber)', 'go-portfolio')}${kpi('red', st.delayed, 'Delayed / blocked (Red)', 'go-portfolio')}${kpi('green', st.completed, 'Completed', 'go-portfolio')}
      ${kpi('amber', st.decisions, 'Pending decisions', 'go-decisions')}${kpi('amber', st.deps, 'Open dependencies', 'go-deps')}${kpi(st.overdue ? 'red' : '', st.overdue, 'Overdue tasks', 'go-overdue')}

    <div class="grid g3 section">
      <div class="card"><div class="hd"><h3>Project health (RAG)</h3><span class="sub">computed live</span></div><div class="bd">
        ${bar('Green — on track', dist.Green, st.total, '#22c55e')}${bar('Amber — at risk', dist.Amber, st.total, '#f59e0b')}${bar('Red — delayed/blocked', dist.Red, st.total, '#ef4444')}${bar('Grey — not started', dist.Grey, st.total, '#9ca3af')}

      <div class="card"><div class="hd"><h3>Priority distribution</h3><span class="sub">proposed, pending approval</span></div><div class="bd">

    </div>
    <div class="grid g2 section">
      <div class="card"><div class="hd"><h3>Projects requiring leadership intervention</h3><span class="sub">${intervene.length}</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th class="nosort">Project</th><th class="nosort">Prio</th><th class="nosort">Health</th><th class="nosort">Why</th></tr></thead><tbody>
        ${intervene.length ? intervene.map(x => '<tr class="row"><td><span class="link" data-act="open" data-id="' + x.p.id + '">' + esc(x.p.name) + '</span><div class="mini">' + esc(x.p.nextAction || '') + '</div></td><td>' + pillPrio(x.p.priority) + '</td><td>' + pillRag(x.h.rag) + '</td><td class="mini">' + esc(x.h.reasons.join('; ')) + (S.decisions.some(d => d.status === 'Open' && d.projectId === x.p.id && d.owner === 'Head of Sales') ? '<br><b>Decision pending with Head of Sales</b>' : '') + '</td></tr>').join('') : '<tr><td colspan="4" class="empty">Nothing needs intervention right now.</td></tr>'}
      </tbody></table></div></div>

  function vPortfolio(st) {
    const f = UI.filters; const q = UI.q.toLowerCase();
    let rows = st.hs.map(x => ({ p: x.p, h: x.h, progress: projectProgress(x.p.id), nm: nextMilestone(x.p), deps: S.dependencies.filter(d => d.projectId === x.p.id && d.status !== 'Closed').length }));
    if (q) rows = rows.filter(r => (r.p.id + ' ' + r.p.name + ' ' + r.p.owner + ' ' + r.p.category + ' ' + r.p.objective).toLowerCase().includes(q));
    ['category', 'priority', 'status', 'type', 'program'].forEach(k => { if (f[k]) rows = rows.filter(r => k === 'program' ? (f[k] === 'none' ? !r.p.program : r.p.program === f[k]) : r.p[k] === f[k]); });
    if (f.health) rows = rows.filter(r => r.h.rag === f.health);
    if (f.owner) rows = rows.filter(r => r.p.owner === f.owner || r.p.accountable === f.owner);
    const sk = UI.sort.portfolio || { k: 'priority', d: 'asc' };
    const key = r => ({ id: r.p.id, name: r.p.name, category: r.p.category, priority: r.p.priority, owner: r.p.owner, accountable: r.p.accountable, status: r.p.status, health: ['Red', 'Amber', 'Green', 'Grey'].indexOf(r.h.rag), progress: r.progress, nm: r.nm && r.nm.due || 'z', due: r.p.due || 'z', deps: r.deps }[sk.k]);
    rows.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * (sk.d === 'desc' ? -1 : 1); });
    const th = (k, l) => '<th data-act="sort" data-t="portfolio" data-k="' + k + '">' + l + (sk.k === k ? (sk.d === 'asc' ? ' ▲' : ' ▼') : '') + '</th>';
    const sel = (k, l, opts) => '<select data-act="filter" data-k="' + k + '"><option value="">' + l + '</option>' + opts.map(o => '<option value="' + esc(o[0]) + '" ' + (f[k] === o[0] ? 'selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
    return `
    <div class="filters">
      ${sel('category', 'All categories', CATS.map(c => [c, c]))}${sel('priority', 'All priorities', PRIOS.map(p => [p, p]))}${sel('status', 'All statuses', PSTATUS.map(s => [s, s]))}${sel('health', 'All health', ['Red', 'Amber', 'Green', 'Grey'].map(s => [s, s]))}${sel('type', 'All types', [...new Set(S.projects.map(p => p.type))].map(t => [t, t]))}${sel('program', 'All programs', [['none', '(No program)']].concat(S.programs.map(p => [p.id, p.id + ' ' + p.name])))}${sel('owner', 'Any owner', people().map(p => [p, p]))}

    </div>
    <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr>${th('id', 'ID')}${th('name', 'Project')}${th('category', 'Category')}${th('priority', 'Prio')}${th('owner', 'Owner')}${th('accountable', 'Accountable')}${th('status', 'Status')}${th('health', 'Health')}${th('progress', 'Progress')}${th('nm', 'Next milestone')}${th('due', 'Due')}${th('deps', 'Deps')}</tr></thead><tbody>
      ${rows.length ? rows.map(r => '<tr class="row"><td class="mini">' + esc(r.p.id) + '</td><td><span class="link" data-act="open" data-id="' + r.p.id + '">' + esc(r.p.name) + '</span><div class="mini">' + esc(r.p.type) + (r.p.program ? ' · ' + r.p.program : '') + '</div></td><td class="mini">' + esc(r.p.category) + '</td><td>' + pillPrio(r.p.priority) + '</td><td>' + person(r.p.owner) + '</td><td>' + person(r.p.accountable) + '</td><td>' + pillStatus(r.p.status) + '</td><td title="' + esc(r.h.reasons.join('; ')) + '">' + pillRag(r.h.rag) + '</td><td><div class="progwrap"><div class="prog"><i style="width:' + r.progress + '%"></i></div>' + r.progress + '%</div></td><td class="mini">' + (r.nm ? esc(r.nm.name) + '<br>' + fmt(r.nm.due) : '—') + '</td><td>' + (r.p.due ? fmt(r.p.due) : '<span class="mini">ongoing</span>') + '</td><td class="num">' + r.deps + '</td></tr>').join('') : '<tr><td colspan="12" class="empty">No projects match.</td></tr>'}
    </tbody></table></div></div>
    <div class="mini" style="margin-top:8px">${rows.length} of ${S.projects.length} projects. Click a column header to sort. Hover Health for reasons.</div>`;
