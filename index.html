<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control Tower | Suraasa</title>
<meta name="description" content="Suraasa's project execution workspace for the sales team.">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>

/* ============================================================
   Suraasa Sales Control Tower
   One ruled sheet, like a teacher's register: a margin column of
   marks on the left, one line per thing, no boxes around lists.
   ============================================================ */
:root {
  color-scheme: light;
  /* Neutrals: the slate scale used on suraasa.com and brand.suraasa.com. Blue: suraasa.com. */
  --sheet: #ffffff;
  --tint: #f1f5f9;
  --tint-2: #e2e8f0;
  --side: #f8fafc;
  --ink: #0f172a;
  --ink-2: #334155;
  --muted: #526077;
  --line: #e2e8f0;
  --line-2: #cbd5e1;
  --accent: #225ba5;
  --accent-ink: #1d4f90;
  --on-accent: #ffffff;
  --primary: #0f172a;
  --on-primary: #ffffff;
  --red: #c8352b;
  --red-bg: #fcedeb;
  --amber: #9a5b00;
  --amber-bg: #fdf3e1;
  --green: #187a4f;
  --green-bg: #e6f5ee;
  --blue-bg: #e8f0fa;
  --grey: #64748b;
  --grey-bg: #f1f5f9;
  --red-mark: #c8352b;
  --amber-mark: #e8a317;
  --green-mark: #1c8a5a;
  --grey-mark: #cbd5e1;
  --on-red: #ffffff;
  --on-green: #ffffff;
  --seq-1: #16396b;
  --seq-2: #225ba5;
  --seq-3: #7fa6dc;
  --shadow: 0 12px 32px rgba(15, 23, 42, .16);
  --scrim: rgba(15, 23, 42, .4);
  /* names the timeline styles use */
  --card: var(--sheet);
  --card-subtle: var(--tint);
  --bg2: var(--tint);
  --border: var(--line);
  --border-strong: var(--line-2);
  --text: var(--ink);
  --text-2: var(--ink-2);
  --muted-2: var(--grey);
  --navy: var(--ink);
  --radius-lg: 10px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --cols-end: 150px 104px 132px;
  --side-w: 232px;
}
[data-theme="dark"] {
  color-scheme: dark;
  --sheet: #0f172a;
  --tint: #1e293b;
  --tint-2: #334155;
  --side: #0b1220;
  --ink: #f1f5f9;
  --ink-2: #cbd5e1;
  --muted: #94a3b8;
  --line: #1e293b;
  --line-2: #334155;
  --accent: #7fb0ee;
  --accent-ink: #a9caf5;
  --on-accent: #0f172a;
  --primary: #f1f5f9;
  --on-primary: #0f172a;
  --red: #ff8f85;
  --red-bg: rgba(255, 143, 133, .14);
  --amber: #f5b94d;
  --amber-bg: rgba(245, 185, 77, .14);
  --green: #5dd3a0;
  --green-bg: rgba(93, 211, 160, .14);
  --blue-bg: rgba(127, 176, 238, .16);
  --grey: #94a3b8;
  --grey-bg: rgba(148, 163, 184, .14);
  --red-mark: #ff8f85;
  --amber-mark: #f5b94d;
  --green-mark: #5dd3a0;
  --grey-mark: #334155;
  --on-red: #0f172a;
  --on-green: #0f172a;
  --seq-1: #d6e4f7;
  --seq-2: #7fb0ee;
  --seq-3: #3f6cab;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  --scrim: rgba(2, 6, 23, .6);
}

/* ── Base ── */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--sheet); color: var(--ink); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
h1, h2, h3, p, dl, dd, ul { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
#main:focus { outline: none; }
.skip { position: absolute; left: 12px; top: -48px; background: var(--ink); color: var(--sheet); padding: 8px 12px; border-radius: 8px; z-index: 100; }
.skip:focus { top: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.quiet { color: var(--muted); font-size: 14px; }
.mini { color: var(--muted); font-size: 13px; }
.tbd { color: var(--muted); }

/* ── App frame: persistent sidebar ── */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.main-col { min-width: 0; }
.side { position: sticky; top: 0; align-self: start; display: flex; flex-direction: column; height: 100vh; padding: 16px 12px; background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; }
.brand { display: block; padding: 2px 8px 0; }
.brand img { display: block; height: 30px; width: auto; }
.brand-sub { padding: 2px 8px 14px; color: var(--muted); font-size: 12px; }
.logo-d { display: none !important; }
[data-theme="dark"] .brand .logo-l { display: none !important; }
[data-theme="dark"] .brand .logo-d { display: block !important; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 0 8px; border-radius: 8px; color: var(--ink-2); font-size: 14px; font-weight: 500; text-align: left; }
.nav button svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
.nav button > span:not(.count) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav button:hover { background: var(--tint); }
.nav a.nav-link { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 0 8px; border-radius: 8px; color: var(--ink-2); font-size: 14px; font-weight: 500; text-align: left;  text-decoration: none; }
.nav a.nav-link svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
.nav a.nav-link > span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav a.nav-link:hover { background: var(--tint); }
.nav button.on { background: var(--blue-bg); color: var(--accent-ink); font-weight: 600; }
.nav button.on svg { color: var(--accent-ink); }
.nav-sep { height: 1px; margin: 10px 8px; background: var(--line); }
.count { min-width: 19px; padding: 0 5px; border-radius: 10px; background: var(--tint-2); color: var(--ink-2); font-size: 12px; font-weight: 600; line-height: 19px; text-align: center; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 24px; background: var(--sheet); border-bottom: 1px solid var(--line); }
.top-logo { display: none; height: 26px; width: auto; }
.tools { margin-left: auto; }
.bell { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; color: var(--ink-2); }
.bell:hover { background: var(--tint); }
.bell svg { width: 20px; height: 20px; }
.bell .count { position: absolute; top: -2px; right: -4px; min-width: 17px; line-height: 17px; font-size: 11px; background: var(--red-mark); color: var(--on-red); }
.ro .needs-write { display: none !important; }
.me-c { display: flex; flex-direction: column; padding: 6px 10px 8px; font-size: 14px; }
.tools { display: flex; align-items: center; gap: 10px; flex: none; }
.find { position: relative; display: flex; align-items: center; gap: 8px; width: 280px; height: 38px; padding: 0 10px; border-radius: 8px; background: var(--tint); color: var(--muted); }
.find:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }
.find svg { flex: none; }
.find input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--ink); font-size: 14px; }
.find input::-webkit-search-cancel-button { display: none; }
.find input::placeholder { color: var(--muted); opacity: 1; }
.find kbd { padding: 0 6px; border-radius: 4px; background: var(--sheet); color: var(--muted); font: 500 12px/18px var(--font); }
.find-results { position: absolute; top: 44px; left: 0; width: min(440px, calc(100vw - 24px)); max-height: 70vh; overflow: auto; padding: 6px; background: var(--sheet); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); }
.find-results .quiet { padding: 8px 10px; }
.fr { display: block; width: 100%; padding: 8px 10px; border-radius: 6px; text-align: left; }
.fr:hover, .fr.sel { background: var(--tint); }
.fr-t { display: block; color: var(--ink); font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fr-s { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 4px; color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); }
.sync.green i { background: var(--green); }
.sync.blue i { background: var(--accent); }
.sync.red { color: var(--red); font-weight: 600; }
.sync.red i { background: var(--red); }
.me-btn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--tint-2); color: var(--ink-2); font-size: 13px; font-weight: 700; }

/* ── Menus ── */
.menu-wrap { position: relative; display: flex; }
.nav .menu-wrap { height: 100%; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; display: none; min-width: 190px; padding: 6px; background: var(--sheet); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); }
.menu.right { left: auto; right: 0; }
.menu.open { display: block; }
.menu > button { display: block; width: 100%; padding: 8px 10px; border-radius: 6px; text-align: left; font-size: 14px; font-weight: 500; }
.menu > button:hover { background: var(--tint); }
.menu > a { display: block; padding: 8px 10px; border-radius: 6px; color: inherit; font-size: 14px; font-weight: 500; text-decoration: none; }
.menu > a:hover { background: var(--tint); }
a.btn { text-decoration: none; }
.menu > button.danger { color: var(--red); }
.menu .fsel { padding: 6px 10px 10px; }

/* ── Page ── */
.content { width: 100%; max-width: 1180px; margin: 0 auto; padding: 32px 24px 96px; }
.page-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-h h1 { font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 16px; }
.bar-end { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-left: auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 17px; color: var(--ink-2); font-size: 14px; font-weight: 500; }
.chip span { color: var(--muted); font-size: 13px; }
.chip:hover { border-color: var(--ink-2); }
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.chip.on span { color: inherit; opacity: .75; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--tint); max-width: 100%; overflow-x: auto; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 7px; color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap; }
.seg button span { font-size: 13px; }
.seg button.on { background: var(--sheet); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(27, 37, 64, .12); }
.filters { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.fsel { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.fsel.stack { display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
.fsel select { max-width: 200px; height: 34px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--sheet); color: var(--ink); font-size: 14px; }
.fsel.stack select { max-width: none; width: 100%; }
.linkbtn { color: var(--accent-ink); font-size: 14px; font-weight: 600; }
.linkbtn:hover { text-decoration: underline; }
.linkbtn.danger { color: var(--red); }
.foot { margin-top: 20px; }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--sheet); color: var(--ink); font-size: 14px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--tint); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { filter: brightness(.94); }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13px; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn.danger:hover { background: var(--red-bg); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--tint); }
.btn.icon { width: 38px; padding: 0; }
.btnrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btnrow.nowrap { flex-wrap: nowrap; }

/* ── Shared section heads and notes ── */
.whoami { color: var(--ink-2); font-size: 14px; margin-bottom: 10px; }
.whoami select { height: 32px; margin-left: 4px; padding: 0 6px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--sheet); color: var(--ink); }
.flag { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding: 9px 12px; margin-bottom: 8px; border-radius: 8px; background: var(--amber-bg); color: var(--ink); font-size: 14px; }
.s-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.s-h h2, .sec > h2, .next h2 { font-size: 17px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; }
.s-h h3 { font-size: 15px; font-weight: 700; }

/* ── Home dashboard ── */
.content.wide { max-width: 1400px; }
.dash-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.dash-h h1 { font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 28px; overflow: hidden; }
.stat { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 14px 16px 13px; border-left: 1px solid var(--line); text-align: left; }
.stat:first-child { border-left: 0; }
.stat:hover { background: var(--tint); }
.stat-l { color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
.stat-v { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
.stat-v b { font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
.stat-v small { color: var(--muted); font-size: 14px; }
.stat-n { margin-top: 2px; color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.meter { display: block; width: 100%; height: 4px; margin-top: 8px; border-radius: 2px; background: var(--tint-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.meter.red i { background: var(--red-mark); }
.dash-g { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 28px 40px; margin-bottom: 32px; align-items: start; }
.panel { min-width: 0; }
.panel .bar-row { margin-bottom: 10px; }
.panel .legend { margin: 8px 0 12px; }
.more { display: block; margin-top: 10px; }
.flag b { font-weight: 700; }
.panel .flag { margin: 16px 0 0; }
.panel h3 { margin: 22px 0 4px; font-size: 15px; font-weight: 700; }
.facts-l { border-top: 1px solid var(--line); }
.fl { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; color: var(--ink-2); }
.fl:hover { background: var(--tint); }
.fl b { color: var(--ink); font-weight: 600; white-space: nowrap; }
.panel > .quiet { margin-top: 10px; font-size: 13px; }
.mini-acc { margin-top: 8px; border-top: 0; }
.mini-acc > summary { padding: 4px 0; color: var(--muted); font-size: 13px; font-weight: 500; }

/* parts of a whole */
.segbar { display: flex; gap: 2px; height: 8px; }
.segbar.tall { height: 28px; }
.sb { min-width: 4px; border-radius: 4px; font-size: 13px; font-weight: 700; text-align: left; padding: 0 8px; overflow: hidden; }
.segbar:not(.tall) .sb { padding: 0; border-radius: 3px; }
.sb:hover { filter: brightness(.92); }
.sb-red { background: var(--red-mark); color: var(--on-red); }
.sb-amber { background: var(--amber-mark); color: #1b2540; }
.sb-green { background: var(--green-mark); color: var(--on-green); }
.sb-grey { background: var(--grey-mark); color: var(--ink); }
.lg.sb-red, .lg.sb-amber, .lg.sb-green, .lg.sb-grey { padding: 0; }
.cats { display: grid; gap: 9px; margin-top: 14px; }
.cat { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 20px; align-items: center; gap: 10px; font-size: 13px; }
.cat-n { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-c { color: var(--muted); text-align: right; }

/* work due by week */
.wks { display: flex; gap: 4px; }
.wk { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; padding-top: 2px; border-radius: 6px; }
.wk:hover { background: var(--tint); }
.wk-plot { display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; gap: 2px; width: 100%; height: 168px; }
.wk-plot i { display: block; width: min(24px, 60%); flex: none; }
.wk-plot { padding-bottom: 0; }
.wk-plot i:last-of-type { border-radius: 4px 4px 0 0; }
.wk-v { order: 9; color: var(--ink); font-size: 13px; font-weight: 600; line-height: 1.3; }
.wk-l { width: 100%; padding-top: 5px; border-top: 1px solid var(--line-2); color: var(--muted); font-size: 12px; white-space: nowrap; }
.wk.now .wk-l { color: var(--ink); font-weight: 700; }
.wk-m { display: inline-flex; align-items: center; gap: 4px; min-height: 18px; color: var(--muted); font-size: 12px; }
.wk-m em { width: 7px; height: 7px; background: var(--ink-2); transform: rotate(45deg); border-radius: 1px; }
.w-p0 { background: var(--seq-1); }
.w-p1 { background: var(--seq-2); }
.w-rest { background: var(--seq-3); }
.lg.ms-k { width: 8px; height: 8px; background: var(--ink-2); transform: rotate(45deg); border-radius: 1px; }

/* who holds the work */
.owns { display: grid; gap: 2px; }
.own { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: center; gap: 12px; min-height: 30px; padding: 0 4px; border-radius: 6px; text-align: left; font-size: 14px; }
.own:hover { background: var(--tint); }
.own-n { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.own-n.prop { font-style: italic; color: var(--muted); }
.own-n.none { color: var(--muted); }
.own-b { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; }
.own-b i { display: block; height: 10px; border-radius: 0 4px 4px 0; flex: 0 1 auto; }
.own-b b { flex: none; font-weight: 600; color: var(--ink); }
.o-conf { background: var(--seq-2); }
.o-prop { background: var(--seq-3); }
.o-none { background: var(--grey-mark); }

/* one tooltip */
.tip { position: fixed; z-index: 70; max-width: 240px; padding: 8px 10px; border-radius: 8px; background: var(--ink); color: var(--sheet); font-size: 12px; line-height: 1.4; pointer-events: none; box-shadow: var(--shadow); }
.tip[hidden] { display: none; }
.tip b { display: block; font-size: 14px; font-weight: 700; }

/* the dashboard's lists are narrower: fewer columns */
.dash .rows { --cols-end: 120px 90px; }
.panel h3 { margin-top: 18px; }
.dash .r-task { grid-template-columns: 22px minmax(0, 1fr) 40px 120px 90px; column-gap: 12px; }
.dash .r-proj { grid-template-columns: 22px minmax(0, 1fr) 40px 120px 90px; column-gap: 12px; }
.dash .r-dec { grid-template-columns: 22px minmax(0, 1fr) 120px 90px 72px; column-gap: 12px; }
.dash .r-q { grid-template-columns: 22px minmax(0, 1fr) 120px 90px; column-gap: 12px; }
.dash .r-st, .dash .r-proj .r-prog { display: none; }

/* ── The ruled sheet ── */
.rows { border-top: 1px solid var(--line); }
.r { display: grid; align-items: center; column-gap: 16px; min-height: 54px; padding: 8px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
.r:hover { background: var(--tint); }
.r-main { min-width: 0; display: block; }
.r-t { display: block; max-width: 100%; color: var(--ink); font-weight: 500; line-height: 1.35; text-align: left; }
.r-s { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-who, .r-when { min-width: 0; font-size: 14px; }
.who { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.who + .who { margin-top: 1px; }
.who.proposed { font-style: italic; color: var(--muted); }
.who.none { color: var(--muted); }
.when { color: var(--ink-2); white-space: nowrap; }
.when.none { color: var(--muted); }
.when.soon { color: var(--amber); font-weight: 600; }
.when.late { color: var(--red); font-weight: 600; }
.r-task { grid-template-columns: 22px minmax(0, 1fr) 48px var(--cols-end) 28px; }
.task-del-btn { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; padding: 0; border-radius: 6px; color: var(--muted); opacity: 0.55; transition: opacity .15s, color .15s, background .15s; background: transparent; border: 0; cursor: pointer; flex-shrink: 0; }
.task-del-btn:hover { opacity: 1; color: var(--red); background: var(--tint); }
.task-del-space { width: 26px; height: 26px; display: inline-block; flex-shrink: 0; }
.r-proj { grid-template-columns: 22px minmax(0, 1fr) 48px var(--cols-end); }
.r-dec, .r-dep, .r-q { grid-template-columns: 22px minmax(0, 1fr) var(--cols-end); }
.r-risk { grid-template-columns: 84px minmax(0, 1fr) var(--cols-end); }
.r-act { grid-template-columns: 36px minmax(0, 1fr) 150px 170px; }
.r-week { grid-template-columns: 22px minmax(0, 1fr) 150px 200px 106px; }
.r-person { grid-template-columns: 32px minmax(0, 1fr) 130px 150px; }
.r-ms { grid-template-columns: 22px minmax(0, 1fr) 104px 132px; }
.r-tl { grid-template-columns: minmax(0, 1fr) auto; }
.r-do { justify-self: start; }
.r-head { min-height: 0; padding-top: 6px; padding-bottom: 6px; color: var(--muted); font-size: 13px; cursor: default; }
.r-head:hover { background: none; }
.r.is-done .r-t { color: var(--muted); }
.r-task.is-done .r-t { text-decoration: line-through; }
.r.is-sub { padding-left: 28px; }
.r-facts { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 13px; color: var(--ink-2); }
.st-n b { font-weight: 700; }
.st-n.late { color: var(--red); }
.st-n.amber { color: var(--amber); }
.r-prog { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.prog { flex: 1; max-width: 76px; height: 5px; border-radius: 3px; background: var(--tint-2); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); }
.av { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--tint-2); color: var(--ink-2); font-size: 12px; font-weight: 700; }

/* marks in the margin: shape as well as colour */
.mark { position: relative; display: block; width: 14px; height: 14px; border: 2px solid var(--grey); border-radius: 50%; color: var(--grey); }
.mark.red { border-color: var(--red); background: var(--red); }
.mark.amber { border-color: var(--amber); background: linear-gradient(90deg, var(--amber) 50%, transparent 50%); }
.mark.green { border-color: var(--green); background: var(--green); }
.mark.green::after { content: ''; position: absolute; left: 3px; top: .5px; width: 3px; height: 6px; border: solid var(--sheet); border-width: 0 1.6px 1.6px 0; transform: rotate(40deg); }
.mark.diamond { width: 11px; height: 11px; margin-left: 1px; border-color: var(--accent); border-radius: 2px; transform: rotate(45deg); }
.tick { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 0; border: 2px solid var(--line-2); border-radius: 6px; background: var(--sheet); cursor: pointer; position: relative; }
.tick:hover { border-color: var(--accent); }
.tick:checked { background: var(--green); border-color: var(--green); }
.tick:checked::after { content: ''; position: absolute; left: 5px; top: 1.5px; width: 5px; height: 10px; border: solid var(--sheet); border-width: 0 2px 2px 0; transform: rotate(40deg); }
.st { width: 100%; height: 32px; padding: 0 4px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--ink-2); font-size: 13px; cursor: pointer; }
.st:hover, .st:focus { border-color: var(--line-2); background: var(--sheet); }

/* ── Pills ── */
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 6px; background: var(--grey-bg); color: var(--ink-2); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.amber { background: var(--amber-bg); color: var(--amber); }
.pill.green { background: var(--green-bg); color: var(--green); }
.pill.blue { background: var(--blue-bg); color: var(--accent-ink); }
.pill.outline { background: none; box-shadow: inset 0 0 0 1px var(--line-2); }
.pill.p0 { background: var(--ink); color: var(--sheet); }
.pill.p1 { background: var(--red-bg); color: var(--red); }
.pill.p2, .pill.p3 { padding: 0; background: none; color: var(--muted); font-weight: 500; }

/* ── Task panel ── */
.modal.wide { width: min(680px, 100%); }
.mh-t { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.kv-g { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 16px; margin-bottom: 18px; }
.kv-g dt { color: var(--muted); font-size: 13px; }
.kv-g dd { min-width: 0; font-size: 14px; }
.ts { margin-bottom: 20px; }
.ts h3 { margin-bottom: 6px; font-size: 14px; font-weight: 700; }
.ts h3 .mini { font-weight: 400; }
.ts p { max-width: 72ch; }
.pbar { display: flex; align-items: center; gap: 10px; }
.prog.big { flex: 1; max-width: none; height: 8px; border-radius: 4px; }
.upd-box { padding: 14px; border: 1px solid var(--line-2); border-radius: 10px; }
.upd-box textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--sheet); color: var(--ink); font-size: 15px; line-height: 1.45; resize: vertical; }
.tu-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.tu-row .btn { margin-left: auto; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 14px; }
.chk > span:first-of-type, .chk > a { flex: 1; min-width: 0; }
.chk a { color: var(--accent-ink); }
.chk .dn { color: var(--muted); text-decoration: line-through; }
.chk .tick { width: 18px; height: 18px; flex: none; }
.add-row { display: flex; gap: 8px; margin-top: 8px; }
.add-row input, .add-row select { flex: 1; min-width: 0; height: 34px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--sheet); color: var(--ink); font-size: 14px; }
.sub { display: flex; justify-content: space-between; gap: 12px; width: 100%; padding: 8px 2px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; }
.sub:hover { background: var(--tint); }
.note-i { padding: 10px 0; border-top: 1px solid var(--line); }
.note-i .c-h { margin-bottom: 2px; font-size: 14px; }
.tl { list-style: none; margin: 8px 0 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.tl time { color: var(--muted); font-size: 13px; }
.tl em { display: block; color: var(--muted); font-size: 13px; font-style: normal; }
.tl-f { flex-wrap: wrap; }
.tl-f .chip { height: 28px; padding: 0 9px; font-size: 13px; }
.flag.red { background: var(--red-bg); }
.flag.green { background: var(--green-bg); }
.r-note { grid-template-columns: 22px minmax(0, 1fr) auto; }
.r-note.is-read .r-t { color: var(--muted); font-weight: 400; }
.r-user { grid-template-columns: 32px minmax(0, 1fr) 130px 90px; }
.is-cancelled .r-t { color: var(--muted); text-decoration: line-through; }

/* ── Breadcrumb, selection, loading ── */
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; margin-bottom: 10px; color: var(--muted); font-size: 14px; }
.crumbs span:last-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bulk-bar { position: sticky; top: 68px; z-index: 5; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--sheet); font-size: 14px; }
.bulk-bar .btn { margin-left: auto; }
.skel { display: grid; gap: 12px; }
.skel i { display: block; height: 44px; border-radius: 8px; background: var(--tint); }
.skel .sk-h { width: 240px; height: 34px; }
.skel .sk-b { height: 110px; }
.empty { padding: 40px 0; }
.empty h2 { margin-bottom: 6px; font-size: 18px; font-weight: 700; }
.empty p { margin-bottom: 14px; color: var(--muted); }

/* ── Board and calendar ── */
.board { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.bcol { min-width: 0; min-height: 200px; padding: 10px; border-radius: 10px; background: var(--tint); }
.bcol h3 { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
.bcol h3 span { color: var(--muted); font-weight: 500; }
.card-t { display: block; margin-bottom: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); cursor: pointer; }
.card-t .r-t { font-size: 14px; }
.card-t .r-s { white-space: normal; }
.card-m { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 13px; }
.cal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-h h3 { font-size: 16px; font-weight: 700; }
.cal-w, .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.cal-w span { padding: 4px 6px; color: var(--muted); font-size: 12px; }
.cal-c { min-height: 92px; padding: 6px; background: var(--tint); border-radius: 6px; font-size: 12px; min-width: 0; }
.cal-c.off { background: none; }
.cal-c.now { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-c b { display: block; margin-bottom: 2px; font-weight: 600; }
.cal-i { display: block; width: 100%; margin-top: 2px; padding: 2px 4px; border-radius: 4px; background: var(--sheet); font-size: 12px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-i.late { color: var(--red); }

/* ── Reports ── */
.trend { display: block; width: 100%; max-width: 760px; }
.trend .ln { fill: none; stroke: var(--seq-2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.trend .pt { fill: var(--seq-2); stroke: var(--sheet); stroke-width: 2; }
.trend .ax { stroke: var(--line); }
.trend .tk { fill: var(--muted); font-size: 12px; }
.tbl .nw { white-space: nowrap; }
.pf td { vertical-align: middle; }
.dl.sp { margin: 12px 0; }

/* ── Sign-in ── */
.signin-c { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(360px, 100%); text-align: center; }
.signin-c img { height: 44px; width: auto; }
.signin-c h1 { font-size: 22px; font-weight: 700; }

/* ── Groups and fold-outs ── */
.g { margin-top: 8px; }
.g-h { display: flex; align-items: center; gap: 6px; width: 100%; padding: 12px 0; text-align: left; }
.g-t { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.g-t.late { color: var(--red); }
.g-n { color: var(--muted); font-size: 14px; }
.chev { flex: none; color: var(--muted); transition: transform .12s ease; }
.g-h.open .chev, .acc[open] > summary .chev { transform: rotate(90deg); }
.acc { margin-top: 12px; border-top: 1px solid var(--line); }
.acc > summary { display: flex; align-items: center; gap: 6px; padding: 12px 0; font-weight: 600; cursor: pointer; list-style: none; }
.acc > summary::-webkit-details-marker { display: none; }
.acc-bd { padding: 2px 0 16px 22px; }
.in-g { margin: 2px 0 10px; }

/* ── Project page ── */
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; color: var(--muted); font-size: 14px; font-weight: 500; }
.back::before { content: ''; width: 7px; height: 7px; border: solid currentColor; border-width: 0 0 2px 2px; transform: rotate(45deg); }
.back:hover { color: var(--ink); }
.p-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.p-title { min-width: 0; }
.p-title h1 { font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
.p-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 24px; margin: 22px 0; }
.facts dt { color: var(--muted); font-size: 13px; }
.facts dd { font-weight: 500; min-width: 0; }
.clip { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 24px; overflow-x: auto; }
.tabs button { position: relative; display: flex; align-items: center; gap: 6px; padding: 10px 0; color: var(--muted); font-size: 15px; font-weight: 500; white-space: nowrap; }
.tabs button span { font-size: 13px; }
.tabs button.on { color: var(--ink); font-weight: 600; }
.tabs button.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
.sec { margin-bottom: 28px; }
.sec > .quiet + .btnrow, .sec > .flag + .btnrow { margin-top: 12px; }
.sec > .dl + .quiet { margin-top: 10px; }
.sec > h2 { margin-bottom: 8px; }
.next { padding-left: 14px; border-left: 3px solid var(--accent); margin-bottom: 28px; max-width: 72ch; }
.next h2 { font-size: 14px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.next p { font-size: 19px; line-height: 1.4; font-weight: 500; letter-spacing: -.01em; }
.ws { margin-bottom: 26px; }
.ms { border-top: 1px solid var(--line); }
.ms .r { border-bottom-color: var(--line); }
.r-ms { background: var(--tint); }
.r-ms .r-t { font-weight: 600; }
.ms .r-task { padding-left: 34px; }
.dl { display: grid; grid-template-columns: 170px minmax(0, 72ch); gap: 8px 20px; }
.dl dt { color: var(--muted); font-size: 14px; }
.list { padding-left: 18px; }
.list li + li { margin-top: 3px; }
.upd { padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.c-h { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 8px; }
.c-acts { margin-left: auto; display: flex; gap: 10px; }
.c-acts .linkbtn, .c-h .linkbtn { font-size: 13px; }
.c-h > .linkbtn { margin-left: auto; }
.comment { padding: 10px 0; border-top: 1px solid var(--line); }
.comment .c-h { margin-bottom: 2px; }
.c-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.c-form input:not([type=hidden]) { flex: 1 1 200px; height: 38px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--sheet); }
.c-form input[name=who] { flex: 0 1 150px; }

/* ── Plain tables (only where the content is a real grid) ── */
.tbl-wrap { position: relative; overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line-2); color: var(--muted); font-size: 13px; font-weight: 500; text-align: left; white-space: nowrap; }
.tbl td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td .r-t { font-weight: 500; }
.tbl tr[data-act] { cursor: pointer; }
.tbl tr[data-act]:hover td { background: var(--tint); }
.flags { display: flex; flex-wrap: wrap; gap: 4px; }

/* ── How we work ── */
.grid { display: grid; gap: 24px; }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.plain { min-width: 0; }
.charts { margin-bottom: 24px; }
.card { min-width: 0; }
.card .hd h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { display: inline-block; width: 12px; height: 8px; border-radius: 2px; }
.lg.green { background: var(--green); } .lg.amber { background: var(--amber); } .lg.red { background: var(--red); } .lg.grey { background: var(--line-2); }
.lg.dia { width: 9px; height: 9px; background: var(--ink); transform: rotate(45deg); border-radius: 1px; }
.lg.today { width: 2px; height: 12px; background: var(--accent); }

/* ── Empty ── */
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 28px 0; border-top: 1px solid var(--line); }
.empty b { font-size: 16px; font-weight: 600; }
.empty span { color: var(--muted); }
.empty .btn { margin-top: 8px; }

/* ── Side panel ── */
.modal-bg { position: fixed; inset: 0; z-index: 50; background: var(--scrim); animation: fade .14s ease; }
.modal { position: absolute; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; width: min(520px, 100%); background: var(--sheet); box-shadow: var(--shadow); animation: slide .18s ease; }
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(24px); opacity: .6; } }
.mh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.mh h2 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.mb { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px; }
.mf { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.mf-l { display: flex; gap: 4px; margin-right: auto; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form.one { grid-template-columns: minmax(0, 1fr); }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f.full { grid-column: 1 / -1; }
.f > label, .f-l { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.req { color: var(--muted); font-weight: 400; }
.f input, .f select, .f textarea { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--sheet); color: var(--ink); font-size: 15px; }
.f textarea { resize: vertical; line-height: 1.45; }
.f input[type=file] { padding: 7px; }
.f input::placeholder { color: var(--muted); opacity: 1; }
.btnrow input { flex: 1; min-width: 0; min-height: 38px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--sheet); }
.static p { font-size: 15px; }
.hint { color: var(--muted); font-size: 13px; }
.ferr { color: var(--red); font-size: 14px; font-weight: 500; margin-top: 12px; }
.ferr:empty { display: none; }
.more-f { margin-top: 16px; }
.more-f > .form { padding-bottom: 8px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }

/* ── Toast ── */
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; display: flex; align-items: center; gap: 14px; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--sheet); font-size: 14px; font-weight: 500; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: opacity .14s ease, transform .14s ease; }
.toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.toast.err { background: var(--red); color: var(--sheet); }
.toast button { color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }

/* ── Phone tab bar ── */
.tabbar { display: none; }

/* ── Gantt / Roadmap ── */
.gantt2 { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); margin-bottom: 28px; }
.gscroll { overflow-x: auto; }
.gscroll::-webkit-scrollbar { height: 6px; }
.gscroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.grow {
  display: flex;
  border-bottom: 1px solid var(--border);
  min-height: 46px;
}

.grow.head {
  min-height: 38px;
  background: var(--tint);
  position: sticky;
  top: 0;
  z-index: 3;
  border-bottom: 2px solid var(--border);
}

.grow.ms { min-height: 34px; background: var(--card-subtle); }

.glabel {
  position: sticky;
  left: 0;
  z-index: 2;
  background: var(--card);
  width: 300px;
  min-width: 300px;
  border-right: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: background .12s;
}

.glabel:hover { background: var(--bg2); }

.gtrack { position: relative; flex: 1; min-height: inherit; }
.gm { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--border); }

.gbar.red { background: #c8352b; }
.gbar.grey { background: #667089; }

}

.gmslabel { position: absolute; top: 9px; font-size: 11px; color: var(--text-2); white-space: nowrap; font-weight: 500; }

.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }

/* ── Lane rows ── */

}

.grow.lane .glabel {

}

.lane-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--lc);  }
.grow.lane .gtrack .gm { opacity: .45; }
.gbar { height: 22px; top: 12px; font-size: 12px; font-weight: 600; padding: 0 10px; }
.gbar span { overflow: hidden; text-overflow: ellipsis; }
.grow.proj { min-height: 54px; }
.gms { top: 37px; }

/* ── Charts ── */

/* ── Narrower laptops ── */

}

/* ── Tablets and phones: rows fold into two lines, tab bar replaces the menu ── */

  .r { grid-template-columns: 22px minmax(0, 1fr) auto auto; row-gap: 3px; min-height: 0; padding: 11px 0; }
  .r > :first-child { grid-row: 1 / span 2; align-self: start; margin-top: 2px; }

  .p-head .btnrow { flex-wrap: nowrap; }

  .r-risk { grid-template-columns: 84px minmax(0, 1fr) auto auto; }
  .r-risk .r-who { grid-column: 2; }
  .r-act { grid-template-columns: 36px minmax(0, 1fr) auto; }
  .r-act > .r-who { grid-column: 2; }
  .r-act > .r-when { grid-column: 3; }
  .r-person { grid-template-columns: 32px minmax(0, 1fr) auto; }

  .r-person > .r-when { grid-column: 2 / -1; grid-row: 2; }
  .r-ms { grid-template-columns: 22px minmax(0, 1fr) auto; padding-left: 6px; padding-right: 6px; }
  .r-ms > :first-child { grid-row: auto; }

  .r-ms .r-when { grid-column: 3; grid-row: 1; }
  .r-tl { display: flex; justify-content: space-between; gap: 12px; }
  .r-tl > :first-child { margin-top: 0; }
  .r-tl .r-main { flex: 1 1 0; min-width: 0; }
  .r-tl .r-when { flex: none; }
  .r-week { grid-template-columns: 22px minmax(0, 1fr) auto; }

  .r-week .r-facts { grid-column: 2 / -1; grid-row: 3; }
  .r-week .r-do { display: block; grid-column: 2 / -1; grid-row: 4; margin-top: 6px; }
  .r.is-sub, .ms .r-task { padding-left: 14px; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .dl dd { margin-bottom: 10px; }
  .g3 { grid-template-columns: minmax(0, 1fr); }
  .acc-bd { padding-left: 0; }
  .bar-end { margin-left: 0; }
  .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; max-width: 100vw; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
  .bar-row { width: 100%; }
  .seg { width: 100%; }
  .seg button { flex: 1; justify-content: center; }
  .modal, .modal.wide { width: 100%; }
  .kv-g { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tl li { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .board { grid-template-columns: repeat(6, 240px); }
  .cal-c { min-height: 62px; padding: 3px; }
  .cal-i { display: none; }
  .r-note { grid-template-columns: 22px minmax(0, 1fr); }
  .r-note .linkbtn { grid-column: 2; justify-self: start; }
  .tbl.pf { min-width: 980px; }
  .glabel { width: 170px; min-width: 170px; }
  .mf .btn { flex: 0 1 auto; }
}
@media (max-width: 400px) {
  .form { grid-template-columns: minmax(0, 1fr); }
  .f { grid-column: 1 / -1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ── Print ── */

.hb-t { display: block; height: 10px; border-radius: 0 4px 4px 0; background: var(--tint); overflow: hidden; }
.hb-t i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); }
.hb b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.load { display: block; width: 100%; max-width: 160px; height: 4px; margin-top: 4px; border-radius: 2px; background: var(--tint); overflow: hidden; }
.load i { display: block; height: 100%; background: var(--accent); }
.t-red { color: var(--red); }
.signin-card .auth-err { margin-top: 12px; }
@media (max-width: 1180px) { .stats.s8 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .stats.s8 .stat:nth-child(4) { border-left: 1px solid var(--line); } .stats.s8 .stat:nth-child(n+4) { border-top: 0; } .stats.s8 .stat:nth-child(n+5) { border-top: 1px solid var(--line); } .chart-g { gap: 22px 28px; } }
@media (max-width: 820px) {
  .stats.s8 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats.s8 .stat { border-left: 0; border-top: 1px solid var(--line); }
  .stats.s8 .stat:nth-child(-n+2) { border-top: 0; }
  .stats.s8 .stat:nth-child(even) { border-left: 1px solid var(--line); }
  .chart-g { grid-template-columns: minmax(0, 1fr); }
  .cmd-row { flex-wrap: wrap; }
  .cmd-row input { flex-basis: 100%; }
  .hb { grid-template-columns: minmax(0, 120px) minmax(0, 1fr) 40px; }
  .done-list li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .kv-g.kv-2 { grid-template-columns: minmax(0, 1fr); }
}
.mgmt-controls label { min-width: 0; max-width: 100%; }
.mgmt-emp-select { min-width: 0; max-width: 100%; }
.mgmt-controls .mgmt-search { min-width: 0; }
.stats.s10 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.stats.s10 .stat:nth-child(6) { border-left: 0; }
.stats.s10 .stat:nth-child(n+6) { border-top: 1px solid var(--line); }
.emp-one { display: flex; align-items: center; gap: 10px; }
.emp-one > span:last-child { display: flex; flex-direction: column; min-width: 0; }
.emp-match.ok { flex-direction: column; align-items: stretch; }
.emp-row { display: flex; align-items: center; gap: 10px; }
img.emp-av { object-fit: cover; }
@media (max-width: 1180px) { .stats.s10 { grid-template-columns: repeat(5, minmax(0, 1fr)); } .stats.s10 .stat:nth-child(4) { border-left: 1px solid var(--line); } .stats.s10 .stat:nth-child(n+4) { border-top: 0; } .stats.s10 .stat:nth-child(6) { border-left: 0; } .stats.s10 .stat:nth-child(n+6) { border-top: 1px solid var(--line); } }
@media (max-width: 820px) {
  .stats.s10 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats.s10 .stat { border-left: 0; border-top: 1px solid var(--line); }
  .stats.s10 .stat:nth-child(-n+2) { border-top: 0; }
  .stats.s10 .stat:nth-child(even) { border-left: 1px solid var(--line); }
}
.temp-pw { margin: 12px 0; padding: 12px; border: 1px solid var(--line, #e2e8f0); border-radius: 8px; font: 600 18px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; user-select: all; word-break: break-all; }
.signin-card .auth-sub:last-of-type { text-align: center; }

</style>

    'In Review': ['Not Started', 'In Progress', 'On Hold', 'Awaiting Approval', 'Changes Requested', 'Completed', 'Cancelled'],
    'Awaiting Approval': ['Not Started', 'In Progress', 'On Hold', 'In Review', 'Changes Requested', 'Completed', 'Cancelled'],
    'Changes Requested': ['Not Started', 'In Progress', 'On Hold', 'In Review', 'Blocked', 'Completed', 'Cancelled'],

    'Cancelled': ['Not Started', 'In Progress', 'On Hold', 'Completed']

  // The simple view of a task. Each stage is a way of setting the status, so the two can never disagree.
  const STAGE_STATUS = { 'Not yet started': 'Not Started', 'Moved ahead': 'In Progress', 'Completed': 'Completed', 'Parked': 'On Hold', 'Dropped': 'Cancelled' };

    if (to === 'Cancelled' && !String(extra.cancelReason || t.cancelReason || '').trim()) return 'Give a reason for cancelling.';
    if (to === 'Blocked' && !String(extra.blockerText || (t.blocker && t.blocker.text) || '').trim()) return 'Say what is blocking this task.';

  const subtasksOf = (tasks, id) => tasks.filter(t => t.parent === id);

  /** A task's completion. Finished only when it is really Completed: at most 99 before that. */
  function taskPct(t, tasks) {

    const subs = subtasksOf(tasks, t.id).filter(x => !isCancelled(x));
    let v;
    if (subs.length) {

      v = subs.reduce((a, x) => a + weightOf(x) * taskPct(x, tasks), 0) / total;

  /** Top-level, non-recurring, non-cancelled tasks count. Subtasks count through their parent. */
  const countedTasks = tasks => tasks.filter(t => !t.parent && !isCancelled(t) && t.kind !== 'Recurring');

    const total = list.reduce((a, t) => a + weightOf(t), 0);

  function milestonePct(m, tasksOfProject) {

  const readyForClosure = (p, tasksOfProject) => {

    const list = tasksOfProject.filter(t => !isCancelled(t));
    if (!list.length) return false;
    return list.every(isDone) && (p.milestones || []).every(m => m.status === 'Completed' || list.filter(t => t.ms === m.id).every(isDone));
  };

  /**
   * Health, always with its reasons.
   * d = { tasks, milestones, deps, lastUpdateTs, today, now, rules, progressAgo }
   */
  function health(p, d) {
    const r = Object.assign({}, DEFAULT_RULES, d.rules || {});
    const today = d.today;
    const daysTo = s => isDate(s) ? dayNum(s) - today : null;
    if (p.status === 'Completed') return { rag: 'Green', level: 'Completed', reasons: ['Completed'] };
    const ts = d.tasks.filter(t => !isCancelled(t));
    const open = ts.filter(isOpen);
    const overdue = open.filter(t => isDate(t.due) && daysTo(t.due) < 0);
    const high = overdue.filter(t => t.priority === 'P0' || t.priority === 'P1');
    const share = open.length ? Math.round(overdue.length / open.length * 100) : 0;
    const lateMs = (p.milestones || []).filter(m => m.status !== 'Completed' && isDate(m.due) && daysTo(m.due) < 0);
    const lateDeps = d.deps.filter(x => isDate(x.requiredBy) && daysTo(x.requiredBy) < 0);
    const blocked = open.filter(t => t.status === 'Blocked');

    if (p.status === 'Blocked' || blocked.some(t => t.priority === 'P0')) {
      const why = [];
      if (p.status === 'Blocked') why.push('Project status is Blocked');
      if (blocked.length) why.push(blocked.length + ' blocked task' + (blocked.length > 1 ? 's' : ''));

    }
    const red = [];
    if (lateMs.length) red.push(lateMs.length + ' overdue milestone' + (lateMs.length > 1 ? 's' : ''));
    if (lateDeps.length) red.push(lateDeps.length + ' dependency past its needed-by date');
    if (high.length) red.push(high.length + ' high-priority task' + (high.length > 1 ? 's' : '') + ' overdue');

    if (!started && !overdue.length) return { rag: 'Grey', level: 'Not started', reasons: ['Not started'] };

    const amber = [];
    if (overdue.length) amber.push(overdue.length + ' of ' + open.length + ' open tasks overdue');
    if (blocked.length) amber.push(blocked.length + ' blocked task' + (blocked.length > 1 ? 's' : ''));

    const soonDeps = d.deps.filter(x => isDate(x.requiredBy) && daysTo(x.requiredBy) <= r.soonDays * 2);
    if (soonDeps.length) amber.push(soonDeps.length + ' open dependency due soon');
    if (p.status === 'In Progress') {

  }

  // ---------- dependencies ----------

  /**

  function notifications(d) {
    const out = [];
    const add = (id, kind, text, go, ts, level) => out.push({ id, kind, text, go, ts: ts || '', level: level || 'info' });
    const name = d.me;
    if (!name) return out;
    const todayStr = d.todayStr;
    const own = t => (d.ownsTask ? d.ownsTask(t) : d.mine(t.owner));
    const gaveIt = t => !!d.email && String(t.assignedByEmail || '').toLowerCase() === d.email;
    d.tasks.forEach(t => {
      if (!isOpen(t) || !isDate(t.due)) return;
      const left = dayNum(t.due) - d.today;
      if (own(t)) {
        if (left < 0) add('overdue:' + t.id + ':' + todayStr, 'Overdue', '"' + t.name + '" is ' + Math.abs(left) + (left === -1 ? ' day' : ' days') + ' late', { task: t.id }, todayStr, 'red');

        else if (left === 1) add('due1:' + t.id, 'Due tomorrow', '"' + t.name + '" is due tomorrow', { task: t.id }, todayStr, 'amber');

    d.tasks.forEach(t => {
      const p = d.projects.find(x => x.id === t.projectId);
      if (t.status === 'Blocked' && p && d.ownsProject(p)) add('blocked:' + t.id + ':' + (t.blocker && t.blocker.ts || ''), 'Blocked', '"' + t.name + '" is blocked' + (t.blocker && t.blocker.text ? ': ' + t.blocker.text : ''), { task: t.id }, t.blocker && t.blocker.ts, 'red');
      if ((t.status === 'In Review' || t.status === 'Awaiting Approval') && p && (d.ownsProject(p) || gaveIt(t))) add('review:' + t.id, 'Review requested', '"' + t.name + '" is waiting for your review', { task: t.id }, t.updatedAt, 'amber');
      if (t.extensionRequest && p && d.ownsProject(p)) add('ext:' + t.id + ':' + t.extensionRequest.ts, 'More time requested', '"' + t.name + '": ' + t.extensionRequest.by + ' asked for more time', { task: t.id }, t.extensionRequest.ts, 'amber');

      });

    (d.audit || []).forEach(a => {
      if (a.actorName === name) return;
      const go = a.taskId && d.tasks.some(t => t.id === a.taskId) ? { task: a.taskId } : a.projectId && d.projects.some(p => p.id === a.projectId) ? { project: a.projectId } : {};
      if ((a.action === 'owner_changed' || a.action === 'task_assigned' || a.action === 'project_assigned') && a.field === 'owner' && d.mine(a.newValue) && !(a.action === 'owner_changed' && d.mine(a.oldValue))) add('a:' + a.activityId, 'Assigned to you', a.text, go, a.ts);
      if (a.action === 'owner_changed' && a.field === 'owner' && d.mine(a.oldValue) && !d.mine(a.newValue)) add('a:' + a.activityId, 'Reassigned', a.text, go, a.ts);
      const tk = a.taskId ? d.tasks.find(t => t.id === a.taskId) : null;
      if (tk && a.action === 'status_changed' && a.newValue === 'Completed') {
        const pj = d.projects.find(x => x.id === tk.projectId);
        if ((pj && d.ownsProject(pj)) || gaveIt(tk)) add('a:' + a.activityId, 'Completed', '"' + tk.name + '" was completed by ' + a.actorName, go, a.ts);
      }
      if (tk && a.action === 'status_changed' && (a.newValue === 'In Review' || a.newValue === 'Awaiting Approval') && own(tk) && !gaveIt(tk) && !d.projects.some(x => x.id === tk.projectId && d.ownsProject(x))) add('a:' + a.activityId, 'Review requested', '"' + tk.name + '" was sent for review by ' + a.actorName, go, a.ts, 'amber');

    });

    const late = out.filter(n => n.kind === 'Overdue');
    if (late.length > 5) {
      const rest = out.filter(n => n.kind !== 'Overdue');
      rest.push({ id: 'overdue-all:' + todayStr, kind: 'Overdue', text: late.length + ' of your tasks are late', go: { view: 'tasks', filter: 'overdue' }, ts: '', level: 'red' });

    return out.filter(n => (seen.has(n.id) ? false : seen.add(n.id))).sort((a, b) => ({ red: 0, amber: 1, info: 2 }[a.level] - { red: 0, amber: 1, info: 2 }[b.level]) || String(b.ts).localeCompare(String(a.ts)));
  }

  // ---------- one-line task commands ----------
  const MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
  const DAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  const realDate = (y, m, d) => { const x = new Date(Date.UTC(y, m - 1, d)); return x.getUTCMonth() === m - 1 && x.getUTCDate() === d ? iso(x) : ''; };
  /** Finds a date in the text. Dates are read day first, as in India. Returns { date, text } or null. */
  function findDate(text, today) {
    const base = new Date(today + 'T00:00:00Z'), add = n => iso(new Date(base.getTime() + n * 86400000));
    const mon = '(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
    const month = w => MONTHS.findIndex(m => m.startsWith(w.toLowerCase().slice(0, 3))) + 1;
    const year = (d, m) => { const y = base.getUTCFullYear(), c = realDate(y, m, d); return c && c >= today ? y : y + 1; };

    if ((m = text.match(new RegExp('\\b' + mon + '\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b,?(?:\\s+(\\d{4}))?', 'i')))) return { date: realDate(m[3] ? +m[3] : year(+m[2], month(m[1])), month(m[1]), +m[2]), text: m[0] };

    if ((m = text.match(new RegExp('\\b(?:by|due|on|before|deadline(?:\\s+is)?|until)\\s+(next\\s+|this\\s+)?(' + DAYS.join('|') + ')\\b|\\b(next\\s+|this\\s+)(' + DAYS.join('|') + ')\\b', 'i')))) {

  }
  /**
   * Reads a sentence into a task. It only fills in what it can prove: a person must match an email
   * exactly, a project must match one project, and anything else is left blank and listed in problems.
   * Whatever it returns still goes through the confirmation step and every check on the server.
   * d = { today, projects, employees }
   */
  function parseCommand(text, d) {
    const task = { name: '', desc: '', projectId: '', ownerEmail: '', priority: '', due: '' }, problems = [];
    let rest = String(text || '').trim().slice(0, 1000);
    const take = m => { rest = rest.replace(m, ' '); };
    const words = { critical: 'P0', urgent: 'P0', high: 'P1', medium: 'P2', normal: 'P2', low: 'P3' };
    let m = rest.match(/(?:description|details)\s*[:\-]\s*(.+)$/i);
    if (m) { task.desc = m[1].trim(); take(m[0]); }
    m = rest.match(/[^\s@<>(),;"']+@[^\s@<>(),;"']+\.[a-z]{2,}/i);
    if (m) {
      const mail = m[0].toLowerCase().replace(/[.,;]+$/, ''), hit = (d.employees || []).find(u => String(u.email).toLowerCase() === mail);

      take(new RegExp('(?:\\bto\\s+)?' + m[0].replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&'), 'i'));
      if (!hit) problems.push(mail + ' is not a registered employee.');
    } else problems.push('Add the employee\'s email.');
    m = rest.match(/\b(critical|urgent|high|medium|normal|low)[\s-]*priority\b/i) || rest.match(/\bpriority\s*(?:is|of|:|-)?\s*(critical|urgent|high|medium|normal|low)\b/i);

    else if ((m = rest.match(/\b(P[0-3])\b/))) { task.priority = m[1]; take(m[0]); }

    const dates = []; let scan = rest, hit = findDate(scan, d.today);
    // A date counts only after a word that means a deadline: "May 5 webinar" is a title.
    const clued = h => /^(?:in|next|this|by|due|on|before|until|deadline)\s/i.test(h.text) || /\b(?:by|due|on|before|until|deadline(?:\s+(?:is|of|on|by))?)\s*:?\s*$/i.test(scan.slice(0, scan.indexOf(h.text)));

    const lu = lastUpdate(p.id);
    const past = (S.snapshots || []).find(r => r.projectId === p.id && r.date === addDays(todayStr(), -rules.stagnantDays));
    return ENGINE.health(p, { tasks: pTasks(p.id), deps, lastUpdateTs: lu && lu.ts, today: dnum(todayStr()), now: Date.now(), rules, progressAgo: past ? +past.progress : null, progressNow: projectProgress(p.id) });

  function raciIssues() {
    const out = [];

  function group(key, title, count, body, defOpen, tone) {
    const open = UI.open[key] !== undefined ? UI.open[key] : defOpen;
    return '<section class="g"><button class="g-h' + (open ? ' open' : '') + '" data-act="group" data-k="' + esc(key) + '" aria-expanded="' + !!open + '">' + CHEV + '<span class="g-t ' + (tone || '') + '">' + esc(title) + '</span><span class="g-n">' + count + '</span></button>' + (open ? '<div class="rows">' + body + '</div>' : '') + '</section>';
  }

  // ---------- rows ----------
  function taskRow(t, o) {
    o = o || {};
    const done = t.status === 'Completed';
    const canWork = canWorkT(t);
    const inPlanOrTasks = (UI.view === 'tasks' || (UI.view === 'project' && UI.ptab === 'plan')) && !o.noDel && !UI.bulkOn;
    const canDel = canDeleteT(t);
    const showDel = (isAdmin() || inPlanOrTasks) && !o.noDel && !UI.bulkOn;
    const delBtn = showDel ? (canDel ? '<button class="btn icon ghost task-del-btn" data-act="del-task-row" data-id="' + esc(t.id) + '" title="Delete task" aria-label="Delete task"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg></button>' : '<span class="task-del-space"></span>') : '';
    return '<div class="r r-task' + (done ? ' is-done' : '') + (t.status === 'Cancelled' ? ' is-cancelled' : '') + (t.parent ? ' is-sub' : '') + '" data-act="open-task" data-id="' + esc(t.id) + '">' +
      (UI.bulkOn ? '<input class="tick pick" type="checkbox" data-act="bulk-pick" data-id="' + esc(t.id) + '" ' + (UI.bulk.has(t.id) ? 'checked' : '') + ' aria-label="Select: ' + esc(t.name) + '">' : '<input class="tick" type="checkbox" data-act="task-done" data-id="' + esc(t.id) + '" ' + (done ? 'checked' : '') + (canWork ? '' : ' disabled') + ' aria-label="Mark done: ' + esc(t.name) + '">') +
      '<span class="r-main"><button class="r-t" data-act="open-task" data-id="' + esc(t.id) + '">' + esc(t.name) + '</button>' + (o.noProject ? '' : '<span class="r-s">' + esc(pName(t.projectId)) + '</span>') + '</span>' +
      '<span class="r-p">' + pillPrio(t.priority) + '</span>' +
      '<span class="r-who">' + who(t.owner) + '</span>' +
      '<span class="r-when">' + when(t.due, done) + '</span>' +
      '<span class="r-st">' + (canWork ? '<select class="st" aria-label="Status of ' + esc(t.name) + '" data-act="task-status" data-id="' + esc(t.id) + '">' + statusOptions(t) + '</select>' : pillStatus(t.status)) + '</span>' +

  function decisionRow(d, o) {
    o = o || {};

    return '<div class="r r-dec' + (open ? '' : ' is-done') + '" data-act="edit-decision" data-id="' + esc(d.id) + '">' +

      '<span class="r-main"><button class="r-t" data-act="edit-decision" data-id="' + esc(d.id) + '">' + esc(d.decision) + '</button><span class="r-s">' + esc(open ? (o.noProject ? (d.impact || '') : (d.projectId ? pName(d.projectId) : 'Whole portfolio')) : (d.final || 'Closed')) + '</span></span>' +
      '<span class="r-who">' + who(d.owner) + '</span>' +
      '<span class="r-when">' + when(d.requiredBy, !open) + '</span>' +

  const riskScore = r => { const s = { High: 3, Medium: 2, Low: 1 }; return (s[r.impact] || 1) * (s[r.probability] || 1); };
  const riskLevel = r => { const s = riskScore(r); return s >= 6 ? ['Critical', 'red'] : s >= 3 ? ['Significant', 'amber'] : ['Low', 'grey']; };

  function riskRow(r, o) {
    o = o || {};
    const lv = riskLevel(r);
    const closed = ['Resolved', 'Closed', 'Mitigated'].includes(r.status);
    return '<div class="r r-risk' + (closed ? ' is-done' : '') + '" data-act="edit-risk" data-id="' + esc(r.id) + '">' +
      '<span class="pill ' + lv[1] + '">' + lv[0] + '</span>' +
      '<span class="r-main"><button class="r-t" data-act="edit-risk" data-id="' + esc(r.id) + '">' + esc(r.desc) + '</button><span class="r-s">' + esc(o.noProject ? (r.mitigation || '') : pName(r.projectId)) + '</span></span>' +
      '<span class="r-who">' + who(r.owner) + '</span>' +
      '<span class="r-when">' + when(r.deadline, closed) + '</span>' +
      '<span class="r-do">' + pillStatus(r.status) + '</span></div>';
  }

  function depRow(d, o) {
    o = o || {};

    const p = x.p, h = x.h, nm = nextMilestone(p), prog = projectProgress(p.id);
    const line = h.rag === 'Amber' || h.rag === 'Red' ? h.level + ': ' + h.reasons[0] : (p.nextAction || p.objective || '');

      '<span class="r-who">' + who(p.owner) + '</span>' +

      '<span class="r-prog"><span class="prog"><i style="width:' + prog + '%"></i></span><span>' + prog + '%</span></span></div>';

  function queueRow(a) {
    const t = /^T-/.test(a.ref) ? S.tasks.find(x => x.id === a.ref) : null;
    if (t) return taskRow(t);
    return '<div class="r r-q" data-act="go" data-go=\'' + JSON.stringify(a.go).replace(/'/g, '&#39;') + '\'>' +

  // ---------- Home ----------
  const weekOf = s => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return localDate(d); };
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return localDate(d); };
  const pct = (n, of) => of ? Math.round(n / of * 100) : 0;

  function stat(label, value, of, note, act, attrs, meter) {
    return '<button class="stat" data-act="' + act + '" ' + (attrs || '') + '><span class="stat-l">' + esc(label) + '</span><span class="stat-v"><b>' + value + '</b>' + (of ? '<small>' + esc(of) + '</small>' : '') + '</span>' +
      '<span class="stat-n">' + esc(note) + '</span>' + (meter ? '<span class="meter ' + meter[1] + '"><i style="width:' + Math.max(meter[0], meter[0] ? 2 : 0) + '%"></i></span>' : '') + '</button>';
  }

  function segBar(parts, total, tall) {
    return '<div class="segbar' + (tall ? ' tall' : '') + '">' + parts.filter(p => p.n).map(p => '<button class="sb sb-' + p.key + '" style="flex:' + p.n + '" data-act="' + p.act + '" ' + (p.attrs || '') + ' data-tip="' + esc(p.label + '|' + p.n + ' of ' + total + ' projects') + '" aria-label="' + esc(p.label + ': ' + p.n + ' of ' + total + ' projects') + '">' + (tall && pct(p.n, total) >= 6 ? p.n : '') + '</button>').join('') + '</div>';
  }

  function workload(openT, milestones) {
    const first = weekOf(todayStr());
    const weeks = Array.from({ length: 8 }, (_, i) => ({ key: addDays(first, i * 7), p0: 0, p1: 0, rest: 0, ms: 0 }));
    const byKey = Object.fromEntries(weeks.map(w => [w.key, w]));
    const late = { key: 'late', p0: 0, p1: 0, rest: 0, ms: 0 };
    let after = 0, noDate = 0;
    openT.forEach(t => {
      if (!isDate(t.due)) { noDate++; return; }
      const w = daysFromToday(t.due) < 0 ? late : byKey[weekOf(t.due)];
      if (!w) { after++; return; }
      if (t.priority === 'P0') w.p0++; else if (t.priority === 'P1') w.p1++; else w.rest++;
    });
    milestones.forEach(m => { const w = byKey[weekOf(m.due)]; if (w) w.ms++; });
    const cols = (late.p0 + late.p1 + late.rest ? [late] : []).concat(weeks);
    const tot = w => w.p0 + w.p1 + w.rest;
    const max = Math.max(1, ...cols.map(tot));
    const name = w => w.key === 'late' ? 'Late' : w.key === first ? 'This week' : fmtShort(w.key);
    const seg = (cls, n) => n ? '<i class="w-' + cls + '" style="height:calc((100% - 26px) * ' + Math.max(n / max, .03).toFixed(4) + ')"></i>' : '';
    const col = w => {
      const label = name(w) + ': ' + plural(tot(w), 'task');
      const tip = (w.key === 'late' || w.key === first ? name(w) : 'Week of ' + name(w)) + '|' + plural(tot(w), 'task') + '|' + w.p0 + ' P0|' + w.p1 + ' P1|' + w.rest + ' P2 or lower' + (w.ms ? '|' + plural(w.ms, 'milestone') : '');
      return '<button class="wk' + (w.key === first ? ' now' : '') + (w.key === 'late' ? ' late' : '') + '" data-act="go-week-of" data-w="' + w.key + '" data-tip="' + esc(tip) + '" aria-label="' + esc(label) + '"><span class="wk-plot"><span class="wk-v">' + (tot(w) || '') + '</span>' + seg('p0', w.p0) + seg('p1', w.p1) + seg('rest', w.rest) + '</span><span class="wk-l">' + esc(w.key === first ? 'Now' : name(w)) + '</span><span class="wk-m">' + (w.ms ? '<em></em>' + w.ms : '') + '</span></button>';
    };
    const peak = cols.reduce((a, w) => tot(w) > tot(a) ? w : a, cols[0]);
    const rows = cols.map(w => '<tr><td>' + esc(name(w)) + '</td><td>' + w.p0 + '</td><td>' + w.p1 + '</td><td>' + w.rest + '</td><td>' + tot(w) + '</td><td>' + w.ms + '</td></tr>').join('');
    return '<section class="panel"><div class="s-h"><h2>Work due, next 8 weeks</h2>' + (tot(peak) ? '<span class="quiet">Busiest: ' + esc(peak.key === first ? 'this week' : peak.key === 'late' ? 'late work' : 'week of ' + name(peak)) + '</span>' : '') + '</div>' +
      '<div class="legend"><span><i class="lg w-p0"></i>P0</span><span><i class="lg w-p1"></i>P1</span><span><i class="lg w-rest"></i>P2 or lower</span><span><i class="lg ms-k"></i>Milestones</span></div>' +
      '<div class="wks">' + cols.map(col).join('') + '</div>' +
      '<p class="quiet">' + plural(after, 'more task') + ' due later, ' + noDate + ' with no date.</p>' +
      '<details class="acc mini-acc"><summary>' + CHEV + 'See the numbers</summary><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Week</th><th>P0</th><th>P1</th><th>P2 or lower</th><th>Tasks</th><th>Milestones</th></tr></thead><tbody>' + rows + '</tbody></table></div></details></section>';
  }

  function ownersPanel(openT) {
    const counts = {};
    openT.forEach(t => {
      const w = whoParts(t.owner);
      const k = w.open ? '__none' : w.name;
      counts[k] = counts[k] || { name: w.name, n: 0, cls: w.open ? 'none' : w.proposed ? 'prop' : 'conf', filter: w.open ? '__none' : w.name };
      counts[k].n++;
    });
    const list = Object.values(counts).sort((a, b) => b.n - a.n);
    const top = list.slice(0, 6);
    const rest = list.slice(6).reduce((a, x) => a + x.n, 0);
    const max = Math.max(1, ...top.map(x => x.n));
    const row = x => '<button class="own" data-act="go-owner" data-o="' + esc(x.filter) + '" data-tip="' + esc(x.name + '|' + plural(x.n, 'open task') + '|' + { conf: 'Confirmed owner', prop: 'Proposed, not confirmed', none: 'Nobody assigned' }[x.cls]) + '" aria-label="' + esc(x.name + ': ' + plural(x.n, 'open task')) + '"><span class="own-n ' + x.cls + '">' + esc(x.name) + '</span><span class="own-b"><i class="o-' + x.cls + '" style="width:' + Math.max(x.n / max * 100, 2) + '%"></i><b>' + x.n + '</b></span></button>';
    return '<section class="panel"><div class="s-h"><h2>Who holds the open work</h2></div>' +
      '<div class="legend"><span><i class="lg o-conf"></i>Confirmed</span><span><i class="lg o-prop"></i>Proposed</span><span><i class="lg o-none"></i>Nobody yet</span></div>' +
      '<div class="owns">' + top.map(row).join('') + '</div>' +
      (rest ? '<p class="quiet">' + plural(rest, 'more task') + ' with other people.</p>' : '') + '</section>';
  }

  function vOverview(st, aq) {
    if (ME.role === 'Task Owner') return vEmployeeDashboard();
    return vManagementDashboard(st, aq);
  }

  function vEmployeeDashboard() {
    const meName = ME.name || UI.me || 'Employee';
    const mineOnly = t => ownsT(t) || isMine(t.accountable);
    const myTasks = liveTasks().filter(t => !ENGINE.isCancelled(t) && mineOnly(t));
    const pendingTasks = myTasks.filter(t => t.status === 'Not Started' || t.status === 'Backlog');
    const inProgressTasks = myTasks.filter(t => ['In Progress', 'In Review', 'Awaiting Approval', 'Changes Requested', 'Blocked'].includes(t.status));
    const completedTasks = myTasks.filter(t => t.status === 'Completed');
    const overdueTasks = myTasks.filter(taskOverdue);
    const upcoming = myTasks.filter(t => ENGINE.isOpen(t) && isDate(t.due) && daysFromToday(t.due) >= 0 && daysFromToday(t.due) <= 14).sort((a, b) => a.due.localeCompare(b.due));

    const recentAudit = (S.audit || []).filter(a => {
      return a.actorEmail === ME.email || (a.taskId && myTasks.some(t => t.id === a.taskId));
    }).slice(0, 6);

    const taskItems = myTasks.map(t => {
      const isDone = t.status === 'Completed';
      const isIP = t.status === 'In Progress';
      return '<div class="r" data-id="' + esc(t.id) + '" style="cursor:default;">' +
        '<span class="r-main">' +
        '<button class="r-t" data-act="open-task" data-id="' + esc(t.id) + '">' + esc(t.name) + '</button>' +
        '<span class="r-s">' + esc(P(t.projectId) ? P(t.projectId).name : t.projectId) + ' &bull; Due: ' + when(t.due, isDone) + '</span>' +
        '</span>' +
        '<span class="r-who"><span class="pill ' + statusTone(t.status) + '">' + esc(t.status) + '</span></span>' +
        '<span class="r-p">' + pillPrio(t.priority) + '</span>' +
        '<div class="dash-quick-status no-print">' +
        (!isDone && canWorkT(t) ? '<button class="dash-quick-btn ' + (isIP ? 'active' : '') + '" data-act="quick-status" data-id="' + esc(t.id) + '" data-to="In Progress">' + (isIP ? 'In Progress' : 'Start') + '</button>' : '') +
        (!isDone ? (canWorkT(t) ? '<button class="dash-quick-btn" data-act="quick-status" data-id="' + esc(t.id) + '" data-to="Completed">Complete</button>' : '') : '<span class="pill green" style="font-size:11px;">Done</span>') +
        '<button class="dash-quick-btn" data-act="open-task" data-id="' + esc(t.id) + '">Update</button>' +
        '</div></div>';
    }).join('');

    return '<div class="dash">' +
      '<div class="emp-welcome-hero">' +
      '<div class="emp-welcome-text">' +
      '<h1>Welcome, ' + esc(meName) + '</h1>' +
      '<p>' + esc([ME.email, ME.designation, ME.department].filter(Boolean).join(' · ')) + ' <span class="emp-role-badge">Employee</span></p>' +
      '</div>' +
      '<button class="emp-profile-btn" data-act="open-profile">' +
      ico('myprojects') +
      '<span>View Profile</span>' +
      '</button>' +
      '</div>' +
      '<div class="stats">' +
      stat('My Pending Tasks', pendingTasks.length, '', 'Not started or in backlog', 'nav', 'data-v="tasks"') +
      stat('My In-Progress Tasks', inProgressTasks.length, '', 'Active & under review', 'nav', 'data-v="tasks"') +
      stat('My Completed Tasks', completedTasks.length, '', pct(completedTasks.length, myTasks.length) + '% complete', 'nav', 'data-v="tasks"', [pct(completedTasks.length, myTasks.length), 'green']) +
      stat('Overdue', overdueTasks.length, '', overdueTasks.length ? 'Needs you first' : 'Nothing late', 'nav', 'data-v="tasks"') +
      stat('Total Assigned Tasks', myTasks.length, '', 'Assigned to you', 'nav', 'data-v="tasks"') +
      '</div>' +
      '<div class="dash-g">' +
      '<section class="panel">' +
      '<div class="s-h"><h2>My Assigned Tasks (' + myTasks.length + ')</h2><button class="btn sm primary no-print" data-act="nav" data-v="tasks">View in Tasks List</button></div>' +
      (myTasks.length ? '<div class="rows">' + taskItems + '</div>' : emptyLine('No open tasks', 'You are all caught up! New tasks will appear here when assigned to you.')) +
      '</section>' +
      '<section class="panel">' +
      '<div class="s-h"><h2>Upcoming deadlines</h2></div>' +
      (upcoming.length ? '<div class="facts-l">' + upcoming.slice(0, 6).map(t => '<button class="fl" data-act="open-task" data-id="' + esc(t.id) + '"><span>' + esc(t.name) + '</span><b>' + esc(fmtShort(t.due)) + '</b></button>').join('') + '</div>' : '<p class="quiet">Nothing is due in the next 14 days.</p>') +
      '<div class="s-h" style="margin-top:22px"><h2>My Recent Activity & History</h2></div>' +

      '<button class="fl" data-act="open-profile"><span>Access Role</span><b>' + esc(roleName()) + '</b></button>' +
      '</div></section></div></div>';
  }

  function vManagementDashboard(st, aq) {
    const everyTask = liveTasks().filter(t => !ENGINE.isCancelled(t));

    // One entry per person: "AK, Divya" is two people, and team or role names are not people.
    const notPeople = new Set((S.roles || []).filter(r => !/^Confirmed$|team/i.test(r.kind || '') || /^(Setters|Closers)$/.test(r.name)).map(r => r.name.toLowerCase()));
    const empSet = new Set();
    liveTasks().forEach(t => { if (t.owner && !isTBD(t.owner)) String(t.owner).split(/\s*[,\/&]\s*|\s+or\s+/i).forEach(n => { const x = n.trim(); if (x && !notPeople.has(x.toLowerCase())) empSet.add(x); }); });
    (S.users || []).forEach(u => { if (u.name && u.active !== false) empSet.add(u.name); });
    const empList = Array.from(empSet).sort();

    const filterEmp = UI.mgmtEmpFilter || '', filterProj = UI.mgmtProject || '';
    const searchQ = (UI.mgmtSearchQ || '').toLowerCase().trim();
    const people = (S.directory || []).concat((S.users || []));
    const emailOf = n => { const u = people.find(x => x.name === n); return u ? u.email : ''; };
    const hasOwner = (t, n) => { const m = emailOf(n), own = String(t.ownerEmail || '').toLowerCase(); return own && m ? own.split(/\s*,\s*/).includes(m) : sameName(t.owner, n); };
    const employees = empList.map(name => ({ name, has: t => hasOwner(t, name) }));

    const allTasks = filterProj ? everyTask.filter(t => t.projectId === filterProj) : everyTask;
    let displayTasks = allTasks;
    if (filterEmp) {
      displayTasks = displayTasks.filter(t => hasOwner(t, filterEmp) || sameName(t.accountable, filterEmp));
    }
    const scoped = filterEmp ? displayTasks : allTasks, d = dashSplit(scoped);
    if (searchQ) {
      displayTasks = displayTasks.filter(t => {
        return (t.name || '').toLowerCase().includes(searchQ) ||
               (t.desc || '').toLowerCase().includes(searchQ) ||
               (t.owner || '').toLowerCase().includes(searchQ) ||
               (t.id || '').toLowerCase().includes(searchQ);
      });
    }
